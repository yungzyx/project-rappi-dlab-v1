# Combinaciones de verticales de Rappi Chile (docs/superpowers/specs/2026-10-16-motor-multivertical-design.md, §3).
# Una fila es el conjunto de verticales que una persona usó en el mes base (M0). La retención es la fracción que vuelve
# a pedir al mes siguiente (M+1); el gasto está en la moneda de la fuente. Es una correlación, no un efecto.
version = "2026-10-16"
nota = "Dato compartido por el equipo de Rappi: cohortes de enero a junio de 2026, Chile, agrupación gruesa (MX crosswalk). Es una correlación, no un efecto."

# Agrupación gruesa de la fuente, aplicada a los verticales del proyecto (supuesto propio): `retail` junta todo el
# comercio que no es restaurante ni Turbo. Favor (RappiFavor) es un servicio sin catálogo y queda fuera.
[grupos]
rest = ["restaurantes"]
turbo = ["turbo"]
retail = ["supermercado", "conveniencia", "farmacia", "licores", "mall", "chocolateria"]

