name: CI

on:
  push:
    branches: [main]
  pull_request:

# Solo lee el repo: ningún job publica ni escribe en GitHub.
permissions:
  contents: read

# Un push nuevo al mismo PR cancela la corrida anterior; las de main terminan todas.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rappi-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rappi-scraper

    services:
      postgres:
        image: pgvector/pgvector:pg17  # misma versión que el Postgres local (Homebrew)
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rappi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/rappi_test

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            rappi-scraper/pyproject.toml
            rappi-ia/requirements.lock.txt

      - name: Instalar
        run: python -m pip install -c ../rappi-ia/requirements.lock.txt -e ".[dev]"  # mismas versiones que rappi-ia

      # La tarea semanal es un script de zsh: sin zsh sus 9 tests se saltaban en silencio.
      - name: Instalar zsh
        working-directory: .
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh

      - name: Lint
        run: |
          python -m ruff check src tests
          python -m ruff format --check src tests

      - name: Tests (unitarios + integración contra Postgres)
        run: python -m pytest

  rappi-ia:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rappi-ia

    services:
      postgres:
        image: pgvector/pgvector:pg17  # trae unaccent (contrib) para la búsqueda sin tildes
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rappi_ia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/rappi_ia_test
      RAPPI_IA_LIGHT: "1"  # sin modelos: los tests usan un embedder falso determinista

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            rappi-ia/pyproject.toml
            rappi-ia/requirements.lock.txt
            rappi-scraper/pyproject.toml

      - name: Instalar (sin extras de modelos)
        run: python -m pip install -c requirements.lock.txt -e ../rappi-scraper -e ".[api,dev]"  # mismas versiones que en el Mac

      - name: Lint
        run: |
          python -m ruff check src tests
          python -m ruff format --check src tests

      - name: Tests (unitarios + integración contra Postgres)
        run: python -m pytest

  prototipo-app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: prototipo-app

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc  # jsdom y vitest piden Node ≥ 22.22 o ≥ 24.15
          cache: npm
          cache-dependency-path: prototipo-app/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  dashboard-empresa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard-empresa

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: dashboard-empresa/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # shellcheck ya viene en las imágenes de ubuntu-latest.
      - name: shellcheck
        run: shellcheck -x scripts/*.sh rappi-ia/scripts/with-test-db-lock.sh

  # La única prueba de punta a punta (app + panel + API + base): lo mismo que `make mvp-check` en el Mac, con Chrome y
  # Postgres de la imagen. Sin modelos (RAPPI_IA_LIGHT=1: embeddings falsos y redacción por plantilla).
  mvp-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rappi_ia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/rappi_ia_test
      RAPPI_IA_LIGHT: "1"
      MVP_CHECK_ARTIFACTS: ${{ github.workspace }}/mvp-check-artifacts  # capturas de lo que falle

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            rappi-ia/pyproject.toml
            rappi-ia/requirements.lock.txt
            rappi-scraper/pyproject.toml

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            prototipo-app/package-lock.json
            dashboard-empresa/package-lock.json

      # El .venv que esperan los scripts (rappi-ia/.venv), sin los extras de modelos ni de desarrollo.
      - name: Instalar rappi-ia (sin modelos)
        working-directory: rappi-ia
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -q -c requirements.lock.txt -e ../rappi-scraper -e ".[api]"

      - name: Instalar la app y el panel
        run: |
          npm --prefix prototipo-app ci
          npm --prefix dashboard-empresa ci

      # Chrome ya viene en ubuntu-latest: se falla aquí, con claro motivo, si algún día deja de venir.
      - name: Chrome
        run: |
          google-chrome --version
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"

      - name: make mvp-check
        run: make mvp-check

      - name: Capturas de lo que falló
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mvp-check-capturas
          path: mvp-check-artifacts
          if-no-files-found: ignore
          retention-days: 7
