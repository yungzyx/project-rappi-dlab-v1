[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rappi-scraper"
version = "0.2.0"
description = "Contenido de Rappi Chile por vertical: scraping de páginas públicas → Postgres + pgvector"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31,<3",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.10"]

[project.scripts]
rappi = "rappi_scraper.cli:main"
rappi-csv = "rappi_scraper.legacy.csv_scraper:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rappi_scraper.storage" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
